submission:
  title: "Eco-Label Vision: AI-Powered Circular Economy Smart Bin Assistant"  # REQUIRED

  problem_statement: >                            # REQUIRED
    Improper waste disposal and wish-cycling cause severe contamination in municipal recycling
    streams, resulting in thousands of tons of recyclable materials ending up in landfills.
    Everyday consumers lack immediate, actionable guidance on item-specific disposal and plastic
    resin identification (RIC 1–7) at the point of disposal, while municipalities lack real-time
    visibility into urban waste segregation patterns.

  solution_summary: >                             # REQUIRED
    Eco-Label Vision is a full-stack smart waste assistant and urban circular economy platform.
    It uses a MobileNetV3-Small deep learning model trained on the UCI RealWaste dataset alongside
    EasyOCR resin code detection to instantly classify waste, identify polymer types, calculate
    CO₂ emissions averted, provide voice-guided disposal instructions, reward eco-positive actions
    through gamification, and aggregate actionable insights for municipal authorities.

  key_features:                                   # REQUIRED — 3 to 5 features
    - "Real-Time AI Waste Classifier: Classifies waste into 9 categories with top-3 confidence scores in ~24ms using MobileNetV3-Small"
    - "OCR Plastic Resin Code Identifier: Extracts RIC codes (1–7) via EasyOCR to determine exact plastic recyclability and contamination risks"
    - "Carbon Impact & Voice Guidance: Calculates real-time CO₂ savings per item and reads step-by-step disposal instructions via Web Speech API"
    - "Circular Gamification Hub: Citizens earn XP, level up, unlock badges, maintain streaks, and play interactive waste mini-games"
    - "Municipality Intelligence Dashboard: City-wide analytics on recycling rates, waste distribution, carbon milestones, and citizen leaderboards"

  tech_stack:
    languages: ["Python 3.10+", "JavaScript (ES6+)", "SQL"]
    frameworks: ["FastAPI", "React 18", "Vite", "Tailwind CSS", "Framer Motion", "PyTorch", "Uvicorn"]
    ibm_technologies: ["IBM Bob AI Assistant", "watsonx.ai-ready Model Architecture", "IBM Cloud Deployment Blueprints"]
    databases: ["SQLite", "SQLAlchemy ORM"]
    other: ["EasyOCR", "MobileNetV3-Small", "OpenStreetMap / Overpass API", "Google Gemini AI API", "Web Speech API", "Recharts", "React-Leaflet"]

  what_we_are_most_proud_of: >
    Our dual AI pipeline combining MobileNetV3 visual classification with EasyOCR resin code
    identification overcomes the common pitfall where all plastics look visually similar but have
    vastly different chemical recyclabilities (e.g., PET #1 vs PVC #3 vs PS #6). We are also
    proud of the end-to-end behavioral loop that turns mundane waste disposal into an engaging,
    rewarded habit, and the dual-stakeholder architecture that delivers simultaneous value to
    individual citizens and municipal policymakers.

  known_limitations: >
    The classifier is optimised for single waste items centred in the camera frame; dense
    multi-object clutter will require future YOLO-based bounding box segmentation. OCR accuracy
    drops on transparent or heavily crumpled plastic containers with faint stamped resin logos
    under poor lighting. IoT weight-sensing smart bin hardware integration is architected in
    software but currently simulated via browser webcam interactions.

