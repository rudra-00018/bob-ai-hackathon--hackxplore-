services:
  - type: web
    name: ecolabel-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOKEN_EXPIRE_HOURS
        value: 168
      - key: PYTHON_VERSION
        value: 3.11.0
